name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Future-proof: opt into Node 24 for JS actions before GH forces it (2026-06-02 default, 2026-09-16 hard cutoff)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # `pnpm install` runs `prepare` -> simple-git-hooks, which installs the pre-push
  # hook into the CI runner, where it then fires on every automated push
  # (create-pull-request, semantic-release) and can reject the push over checks
  # CI has already run. Hooks are a local dev net; the explicit steps below are
  # the CI contract, and they report per-step instead of failing inside a push.
  SKIP_SIMPLE_GIT_HOOKS: "1"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install Solidity dependencies
        working-directory: contracts
        run: forge soldeer install

      - name: Build contracts
        run: pnpm run contracts:build

      - name: Test contracts
        run: pnpm run contracts:test

      - name: Generate contract bindings
        run: pnpm run contracts:typegen

      - name: Lint
        run: pnpm run lint:ci

      - name: Type check
        run: pnpm run types

      # Build before test so scripts/check-bundle-no-web3.test.ts can grep
      # dist/server/ for forbidden web3 imports (audit M5 / issue #28).
      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Knip
        run: pnpm run knip

      # Runs semantic-release. Conventional Commits → version bump:
      #   feat:                                            → minor
      #   fix: / perf: / revert: / refactor:               → patch
      #   BREAKING CHANGE: footer (or `!` after type)      → major
      #   docs: / chore: / ci: / style: / test: / build:   → no release
      # Full rule set in .releaserc.json (commit-analyzer plugin).
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
